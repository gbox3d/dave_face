# Include inside the existing gateway server block (/etc/nginx/sites-available/default).
# :80 은 cloudflared 퀵 터널로도 열린다 — 인증(관리자 토큰)과 시도 제한은 앱이 한다.
location = /dave-face {
    absolute_redirect off;  # 터널(https) 뒤에서도 스킴을 바꾸지 않게 상대 Location
    return 301 /dave-face/;
}

location /dave-face/ {
    proxy_pass http://127.0.0.1:3011/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /dave-face;
    client_max_body_size 12m;   # 등록: JPEG 최대 10장
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}
